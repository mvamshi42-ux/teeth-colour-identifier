name: Android CI - Build APK (auto-detect gradlew)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Detect and run gradlew
        run: |
          set -e
          if [ -f "./gradlew" ]; then
            echo "Found gradlew at repo root"
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          elif [ -f "android/gradlew" ]; then
            echo "Found gradlew in android/"
            chmod +x android/gradlew
            pushd android
            ./gradlew assembleRelease --no-daemon
            popd
          else
            GW=$(find . -type f -name gradlew | head -n 1 || true)
            if [ -n "$GW" ]; then
              echo "Found gradlew at $GW"
              chmod +x "$GW"
              DIR=$(dirname "$GW")
              pushd "$DIR"
              ./gradlew assembleRelease --no-daemon
              popd
            else
              echo "ERROR: gradlew not found at root or android/ - cannot build"
              ls -la
              exit 1
            fi
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/app/build/outputs/apk/release/*.apk
